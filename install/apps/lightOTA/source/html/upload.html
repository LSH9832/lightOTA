<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }}</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">
            <a class="no-underline" href="/ota" style="color:black">{{ name }}</a>
        </div>
        <!-- 右侧链接区域 -->
        <div class="navbar-nav">
            <a class="nav-item no-underline" href="/ota/softwares.html">软件版本管理</a>
            <a class="nav-item no-underline" href="/ota/ota_files.html">OTA文件管理</a>
            <a class="nav-item no-underline" href="/ota/upload.html">OTA文件上传</a>
            <!-- <a class="nav-item no-underline" href="/ota">系统首页</a> -->
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">OTA文件上传</h1>
        
        <div class="split-layout">
            <!-- 左侧上传区域 -->
            <div class="left-panel">
                <h2 class="panel-title">上传区域</h2>
                <div class="card">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📁</div>
                        <div class="upload-text">点击选择文件或拖拽文件到此处</div>
                        <div class="upload-hint">仅支持ota格式文件或包含多个ota的zip压缩文件</div>
                        <input type="file" id="fileInput" accept=".ota,.zip" style="display: none;">
                    </div>
                    
                    <div class="selected-file" id="selectedFile">
                        <span>✅</span>
                        <span class="file-name" id="fileName"></span>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-primary" id="uploadBtn" disabled>开始上传</button>
                        <!-- <button class="btn btn-secondary" id="returnBtn" disabled hidden>返回列表</button> -->
                    </div>
                </div>
            </div>
            
            <!-- 右侧输出区域 -->
            <div class="right-panel">
                <h2 class="panel-title">服务器返回信息</h2>
                <div class="card">
                    <div class="ret_message_area" id="ret_message_area"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
        {{ footer }} ©<script>document.write(new Date().getFullYear());</script>
    </div>
    
    <script src="upload.js"></script>
</body>
</html>
