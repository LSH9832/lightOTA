<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }}</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">
            <a class="no-underline" href="{{ route_prefix }}" style="color:black">{{ name }}</a>
        </div>
        <!-- 右侧链接区域 -->
        <div class="navbar-nav">
            <a class="nav-item no-underline" href="{{ route_prefix }}/softwares.html">软件版本管理</a>
            <a class="nav-item no-underline" href="{{ route_prefix }}/ota_files.html">OTA文件管理</a>
            <a class="nav-item no-underline" href="{{ route_prefix }}/upload.html">OTA文件上传</a>
            <!-- <a class="nav-item no-underline" href="{{ route_prefix }}">系统首页</a> -->
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">OTA 文件详细信息</h1>
        
        <div class="split-layout">
            <!-- 左侧信息区域 -->
            <div class="left-panel">
                <h2 class="panel-title">文件信息</h2>
                <div class="card">
                    <div class="info_show_area" id="info_show_area">
                        <div class="loading">加载中...</div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-success" id="updateBtn">执行更新</button>
                        <button class="btn btn-danger" id="deleteBtn">删除</button>
                        <!-- <button class="btn btn-primary" id="returnBtn" hidden>返回列表</button> -->
                    </div>
                </div>
            </div>
            
            <!-- 右侧输出区域 -->
            <div class="right-panel">
                <h2 class="panel-title">服务器返回信息</h2>
                <div class="card">
                    <div class="ret_message_area" id="ret_message_area"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
        {{ footer }} ©<script>document.write(new Date().getFullYear());</script>
    </div>

    <div id="route_prefix_info" hidden>{{ route_prefix }}</div>
    <div id="domains" hidden>{{ domains }}</div>
    
    <!-- 确认删除弹窗 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3 class="modal-title">确认删除</h3>
            <div class="modal-content" id="confirmMessage">确定要删除该文件吗？此操作不可撤销。</div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="cancelBtn">取消</button>
                <button class="btn btn-danger" id="confirmBtn">确认删除</button>
            </div>
        </div>
    </div>
    
    <script src="info.js"></script>
</body>
</html>
