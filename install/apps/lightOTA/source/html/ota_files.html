<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }}软件OTA系统</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="navbar-brand">
            <a class="no-underline" href="/ota" style="color:black">{{ name }}软件OTA系统</a>
        </div>
        <!-- 右侧链接区域 -->
        <div class="navbar-nav">
            <a class="nav-item no-underline" href="/ota/softwares.html">软件版本管理</a>
            <a class="nav-item no-underline" href="/ota/ota_files.html">OTA文件管理</a>
            <a class="nav-item no-underline" href="/ota/upload.html">OTA文件上传</a>
            <!-- <a class="nav-item no-underline" href="/ota">系统首页</a> -->
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title"> OTA更新包列表</h1>
        <!-- <div class="modal-buttons">
            <button class="btn btn-secondary" id="softlist" hidden>查看已安装软件</button>
            <button class="btn btn-secondary" id="upload" hidden>上传OTA包</button>
        </div> -->
        <br>
        <div class="card">
            <div class="table-container" id="tableContainer">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <div class="footer">
        {{ footer }} ©<script>document.write(new Date().getFullYear());</script>
    </div>
    
    <!-- 错误弹窗 -->
    <div class="modal-overlay" id="errorModal">
        <div class="modal">
            <h3 class="modal-title">提示</h3>
            <div class="modal-content error-text" id="errorMessage"></div>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="closeModalBtn">确定</button>
            </div>
        </div>
    </div>
    
    <script src="ota_files.js"></script>
</body>
</html>
